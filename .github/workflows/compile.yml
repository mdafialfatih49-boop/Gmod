
name: Compile GM Zen Bowls

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl tar lib32gcc-s1

      - name: Download Source Compiler
        run: |
          mkdir -p tools
          wget -O tools/tools.tar.gz \
            https://github.com/ficool2/misc_tools/releases/download/v1/tools++_linux.tar.gz
          tar -xzf tools/tools.tar.gz -C tools
          chmod -R +x tools

      - name: Locate Compiler
        run: |
          VBSP=$(find tools -type f -iname 'vbspplusplus' | head -n 1)
          VVIS=$(find tools -type f -iname 'vvisplusplus' | head -n 1)
          VRAD=$(find tools -type f -iname 'vradplusplus' | head -n 1)

          test -n "$VBSP" || exit 1
          test -n "$VVIS" || exit 1
          test -n "$VRAD" || exit 1

          echo "VBSP=$VBSP" >> $GITHUB_ENV
          echo "VVIS=$VVIS" >> $GITHUB_ENV
          echo "VRAD=$VRAD" >> $GITHUB_ENV

      - name: Locate Map
        run: |
          VMF=$(find . -name "gm_zen_bowls.vmf" | head -n 1)
          test -n "$VMF" || exit 1
          echo "VMF=$VMF" >> $GITHUB_ENV

      - name: Check Garry's Mod Game Files
        run: |
          if [ ! -f "garrysmod/gameinfo.txt" ]; then
            echo "ERROR: Garry's Mod gameinfo.txt missing!"
            echo "GMod game files are required."
            exit 1
          fi

      - name: Compile BSP
        run: |
          "$VBSP" -game "$PWD/garrysmod" "$PWD/$VMF"

      - name: Compile VIS
        run: |
          "$VVIS" -game "$PWD/garrysmod" \
            "$PWD/gm_zen_bowls.bsp"

      - name: Compile RAD
        run: |
          "$VRAD" -game "$PWD/garrysmod" \
            -ldr -final "$PWD/gm_zen_bowls.bsp"

      - name: Upload Map
        uses: actions/upload-artifact@v4
        with:
          name: gm_zen_bowls
          path: gm_zen_bowls.bsp
